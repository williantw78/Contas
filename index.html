<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle Financeiro</title>  

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Controle Financeiro</h1>
	<versao>Versão 2.0</versao>
	<br>
	<br>

    <div class="actions">
      <button onclick="addService()">+ Serviço</button>
      <button onclick="addMonth()">+ Mês</button>
      <button onclick="addIncome()">+ Receita</button>
    </div>

    <div class="table-container">

      <table id="financeTable">

        <thead>
          <tr id="headerRow">
            <th>Serviço</th>
            <th>Responsável</th>
            <th>Junho 2026</th>
          </tr>
        </thead>

        <tbody id="servicesBody">

          <tr>

            <td>
              <div class="cell-flex">
                <input type="text" value="Aluguel">

                <button
                  class="delete-btn"
                  onclick="removeRow(this)"
                >
                  X
                </button>
              </div>
            </td>

            <td>
              <select onchange="updateTotals()">
                <option>Willian</option>
                <option>Duda</option>
				<option>Ambos</option>
              </select>
            </td>

            <td>
				<input
				  type="text"
				  inputmode="decimal"
				  class="money-input"
				  placeholder="0,00"
				  autocomplete="off"
				>
            </td>

          </tr>

        </tbody>

        <tfoot>

          <tr id="totalRow">
            <td colspan="2">
              <strong>Total</strong>
            </td>

            <td class="month-total">
              R$ 0,00
            </td>
          </tr>

        </tfoot>

      </table>

    </div>

    <!-- RECEITAS -->

    <div class="income-section">

      <h2>Valores a Receber</h2>

      <table id="incomeTable">

        <thead>
          <tr>
            <th>Descrição</th>
            <th>Responsável</th>
            <th>Valor</th>
          </tr>
        </thead>

        <tbody id="incomeBody">

          <tr>

            <td>
              <div class="cell-flex">

                <input type="text" value="Salário Willian">

                <button
                  class="delete-btn"
                  onclick="removeRow(this)"
                >
                  X
                </button>

              </div>
            </td>

            <td>
              <select onchange="updateTotals()">
                <option>Willian</option>
                <option>Duda</option>
              </select>
            </td>

            <td>
              <input
                type="text"
                inputmode="numeric"
                class="income-input"
                value="€ 0,00"
              >
            </td>

          </tr>

        </tbody>

      </table>

    </div>

    <!-- RESUMO -->

    <div class="summary">

      <!-- PAGAMENTOS -->

      <div class="card summary-card">

        <div class="summary-grid">

          <div>

            <h3>Total a Pagar</h3>

            <p class="main-total" id="totalToPay">
              R$ 0,00
            </p>

          </div>

          <div>

            <h3>Detalhamento</h3>

            <div class="person-line">
              <span>Willian</span>
              <strong id="willianTotal">
                R$ 0,00
              </strong>
            </div>

            <div class="person-line">
              <span>Duda</span>
              <strong id="dudaTotal">
                R$ 0,00
              </strong>
            </div>

            <!--<div class="person-line">
              <span>Ambos</span>
              <strong id="ambosTotal">
                R$ 0,00
              </strong>
            </div>-->

          </div>

        </div>

      </div>

      <!-- RECEBIMENTOS -->

      <div class="card">

        <h3>Total a Receber</h3>

        <p class="main-total" id="totalToReceive">
          R$ 0,00
        </p>

        <hr>

        <div class="person-line">
          <span>Willian</span>

          <strong id="willianIncome">
            R$ 0,00
          </strong>
        </div>

        <div class="person-line">
          <span>Duda</span>

          <strong id="dudaIncome">
            R$ 0,00
          </strong>
        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
